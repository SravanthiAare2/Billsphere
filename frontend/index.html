<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>BillPlatform — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #0f172a;
    }

    /* Logo / Header */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    /* Modern Login Card */
    .login-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tabs-nav {
      display: flex;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .tab-btn {
      flex: 1;
      padding: 14px;
      border: none;
      background: none;
      font-size: 13.5px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
      text-align: center;
    }

    .tab-btn.active {
      color: #2563eb;
      background: #fff;
      border-bottom: 2px solid #2563eb;
    }
    
    .tab-btn.admin-tab.active {
      color: #10b981;
      border-bottom-color: #10b981;
    }

    .card-body {
      padding: 32px 28px;
    }

    .card-header-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .card-header-section h2 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .card-header-section p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      outline: none;
      transition: border-color .18s, box-shadow .18s;
      background: #fff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    
    .admin-mode input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16,185,129,.12);
    }

    input::placeholder { color: #cbd5e1; }

    .btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all .18s;
      margin-top: 8px;
    }

    .btn-user {
      background: #2563eb;
      color: #fff;
    }
    .btn-user:hover  { background: #1d4ed8; }
    .btn-user:active { transform: scale(.98); }

    .btn-admin {
      background: #10b981;
      color: #fff;
    }
    .btn-admin:hover  { background: #059669; }
    .btn-admin:active { transform: scale(.98); }

    /* Alert message */
    .msg {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      display: none;
      line-height: 1.4;
    }
    .msg.show { display: block; }
    .msg.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .msg.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }

    .toggle-link-container {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }

    .toggle-link-container a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .toggle-link-container a:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      margin-top: 32px;
      font-size: 12.5px;
      color: #94a3b8;
      text-align: center;
    }

    footer a { color: #64748b; text-decoration: none; font-weight: 500; }
    footer a:hover { color: #0f172a; }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="logoG" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4f46e5" />
          <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
      </defs>
      <rect width="32" height="32" rx="8" fill="url(#logoG)" />
      <path d="M9 11C9 9.89543 9.89543 9 11 9H21C22.1046 9 23 9.89543 23 11V21C23 22.1046 22.1046 23 21 23H11C9.89543 23 9 22.1046 9 21V11Z" fill="white" fill-opacity="0.2"/>
      <path d="M12 13C12 11.8954 12.8954 11 14 11H22C23.1046 11 24 11.8954 24 13V21C24 22.1046 23.1046 23 22 23H14C12.8954 23 12 22.1046 12 21V13Z" fill="white"/>
      <path d="M19 14.5L16.5 17.5H19.5L17 20.5" stroke="url(#logoG)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span style="font-weight:800; font-size:22px; color:#0f172a; letter-spacing:-0.03em">Bill<span style="color:#2563eb">Platform</span></span>
  </div>

  <!-- Single Login Card -->
  <div class="login-card" id="loginCard">
    <div class="tabs-nav">
      <button class="tab-btn active" id="tabCustomer" onclick="switchTab('customer')">Customer Portal</button>
      <button class="tab-btn admin-tab" id="tabAdmin" onclick="switchTab('admin')">Admin Console</button>
    </div>

    <!-- ── Customer Form Container ── -->
    <div id="customerSection" class="card-body">
      <!-- Header -->
      <div class="card-header-section">
        <h2 id="customerTitle">Sign In</h2>
        <p id="customerSub">Access your billing account</p>
      </div>

      <!-- Sign In Form -->
      <form id="userForm">
        <div class="form-group">
          <label for="uEmail">Email Address</label>
          <input id="uEmail" type="email" name="username" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="uPass">Password</label>
          <input id="uPass" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-user" id="userBtn">Sign In</button>
      </form>

      <!-- Register Form (hidden by default) -->
      <form id="registerForm" style="display:none">
        <div class="form-group">
          <label for="rName">Full Name</label>
          <input id="rName" type="text" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="rEmail">Email Address</label>
          <input id="rEmail" type="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="rPass">Password</label>
          <input id="rPass" type="password" placeholder="Minimum 8 characters" required minlength="8">
        </div>
        <button type="submit" class="btn btn-user" id="registerBtn">Create Account</button>
      </form>

      <div id="userMsg" class="msg"></div>

      <!-- Toggle between login/register -->
      <div class="toggle-link-container" id="customerToggleContainer">
        Don't have an account? <a href="#" onclick="event.preventDefault(); toggleCustomerMode('register')">Register here</a>
      </div>
    </div>

    <!-- ── Admin Form Container ── -->
    <div id="adminSection" class="card-body admin-mode" style="display:none">
      <!-- Header -->
      <div class="card-header-section">
        <h2>Admin Sign In</h2>
        <p>Manage users & permissions</p>
      </div>

      <form id="adminForm">
        <div class="form-group">
          <label for="aEmail">Admin Email</label>
          <input id="aEmail" type="email" name="username" placeholder="admin@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="aPass">Password</label>
          <input id="aPass" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-admin" id="adminBtn">Admin Sign In</button>
      </form>

      <div id="adminMsg" class="msg"></div>
    </div>
  </div>

  <footer>
    © 2026 BillPlatform Inc. All rights reserved.
  </footer>

  <script>
    const API = '/auth';

    /* Show feedback message */
    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg show ' + type;
    }

    /* Tab switching */
    function switchTab(tab) {
      const tabCustomer = document.getElementById('tabCustomer');
      const tabAdmin = document.getElementById('tabAdmin');
      const customerSection = document.getElementById('customerSection');
      const adminSection = document.getElementById('adminSection');
      const loginCard = document.getElementById('loginCard');

      if (tab === 'customer') {
        tabCustomer.classList.add('active');
        tabAdmin.classList.remove('active');
        customerSection.style.display = 'block';
        adminSection.style.display = 'none';
        loginCard.classList.remove('admin-mode');
      } else {
        tabCustomer.classList.remove('active');
        tabAdmin.classList.add('active');
        customerSection.style.display = 'none';
        adminSection.style.display = 'block';
        loginCard.classList.add('admin-mode');
      }
    }

    /* Toggle Customer sign-in / registration */
    function toggleCustomerMode(mode) {
      const userForm = document.getElementById('userForm');
      const registerForm = document.getElementById('registerForm');
      const customerTitle = document.getElementById('customerTitle');
      const customerSub = document.getElementById('customerSub');
      const customerToggleContainer = document.getElementById('customerToggleContainer');
      const msg = document.getElementById('userMsg');

      msg.className = 'msg'; // Reset message

      if (mode === 'register') {
        userForm.style.display = 'none';
        registerForm.style.display = 'block';
        customerTitle.textContent = 'Create Account';
        customerSub.textContent = 'Get started with your billing portal';
        customerToggleContainer.innerHTML = 'Already have an account? <a href="#" onclick="event.preventDefault(); toggleCustomerMode(\'login\')">Sign In</a>';
      } else {
        userForm.style.display = 'block';
        registerForm.style.display = 'none';
        customerTitle.textContent = 'Sign In';
        customerSub.textContent = 'Access your billing account';
        customerToggleContainer.innerHTML = 'Don\'t have an account? <a href="#" onclick="event.preventDefault(); toggleCustomerMode(\'register\')">Register here</a>';
      }
    }

    /* Generic login call — stores token then redirects */
    async function doLogin(email, pass, msgId, btnId, btnText, redirectTo) {
      const btn = document.getElementById(btnId);
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      try {
        const r = await fetch(API + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'username=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(pass)
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || 'Login failed');

        /* Store token for the portal to use */
        localStorage.setItem('auth_token', data.access_token);

        showMsg(msgId, '✓ Login successful! Redirecting…', 'success');

        /* Redirect after short delay */
        setTimeout(() => { window.location.href = redirectTo; }, 800);

      } catch (err) {
        showMsg(msgId, '✗ ' + err.message, 'error');
        btn.textContent = btnText;
        btn.disabled = false;
      }
    }

    /* Customer Login submit */
    document.getElementById('userForm').addEventListener('submit', e => {
      e.preventDefault();
      doLogin(
        document.getElementById('uEmail').value,
        document.getElementById('uPass').value,
        'userMsg', 'userBtn', 'Sign In', '/customer'
      );
    });

    /* Admin Login submit */
    document.getElementById('adminForm').addEventListener('submit', e => {
      e.preventDefault();
      doLogin(
        document.getElementById('aEmail').value,
        document.getElementById('aPass').value,
        'adminMsg', 'adminBtn', 'Admin Sign In', '/admin'
      );
    });

    /* Registration submit */
    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('rName').value;
      const email = document.getElementById('rEmail').value;
      const pass = document.getElementById('rPass').value;

      const btn = document.getElementById('registerBtn');
      btn.textContent = 'Creating account…';
      btn.disabled = true;

      try {
        const r = await fetch(API + '/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            full_name: name,
            password: pass
          })
        });
        const data = await r.json();
        if (!r.ok) {
          throw new Error(data.detail || 'Registration failed');
        }

        showMsg('userMsg', '✓ Registration successful! Switching to Sign In…', 'success');
        
        setTimeout(() => {
          toggleCustomerMode('login');
          document.getElementById('uEmail').value = email;
          document.getElementById('uPass').value = '';
          btn.textContent = 'Create Account';
          btn.disabled = false;
        }, 1500);

      } catch (err) {
        showMsg('userMsg', '✗ ' + err.message, 'error');
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
